<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUYỂN SINH ĐẠI HỌC | UEH </title>
  <link rel="stylesheet" href="./css/root.css">
  <link rel="stylesheet" href="./css/navbar.css">
</head>
<body>

  <header class="navbar" id="navbar">
    <!-- LOGO: thay src bằng đường dẫn file logo thật (tỉ lệ 184x51px) -->
    <img src="img/logo-navbar.png" alt="UEH University" class="navbar-logo" width="184" height="51">

    <div class="navbar-content" id="navbarContent">

      <!-- HÀNG 1 -->
      <div class="navbar-row-1">
        <div class="navbar-texts-row1">
          <span class="h3 section-spacing-hon">Khám phá I am who I choose to be</span>

          <span class="navbar-check-item section-spacing-hon">
            <svg class="navbar-check-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="h3">Học tại TP. Hồ Chí Minh (KSA)</span>
          </span>

          <span class="navbar-check-item section-spacing-hon">
            <svg class="navbar-check-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="h3">Học tại Vĩnh Long - UEH Mekong (KSV)</span>
          </span>
        </div>

        <button type="button" class="navbar-btn">Đăng ký tư vấn</button>
      </div>

      <!-- HÀNG 2 -->
      <div class="navbar-row-2">
        <a href="#" class="h3 section-spacing-hon">Tại sao chọn UEH?</a>
        <a href="#" class="h3 section-spacing-hon">Học gì ở UEH</a>
        <a href="#" class="h3 section-spacing-hon">Phương thức tuyển sinh</a>
        <a href="#" class="h3 section-spacing-hon">7 bước xét tuyển ở UEH</a>
        <a href="#" class="h3 section-spacing-hon">Chương trình đào tạo</a>
        <a href="#" class="h3 section-spacing-hon">Q&amp;A</a>
      </div>

    </div>

    <!-- Nút hamburger: chỉ hiện khi màn hình < 1280px (xem navbar.css) -->
    <button type="button" class="navbar-toggle" id="navbarToggle"
            aria-label="Mở menu" aria-expanded="false" aria-controls="navbarContent">
      <span class="navbar-toggle-bar"></span>
      <span class="navbar-toggle-bar"></span>
      <span class="navbar-toggle-bar"></span>
    </button>
  </header>
  
<!-- HERO BANNER: 3 ảnh, cả 3 trỏ về cùng 1 liên kết (thay HERO_LINK bên dưới) -->
  <section class="hero" id="hero" aria-label="Banner tuyển sinh">
    <div class="hero-slides">
      <a href="#dang-ky-tu-van" class="hero-slide is-active" data-index="0">
        <img src="img/herobanner-1.png" alt="Banner tuyển sinh UEH 1" class="hero-image">
      </a>
      <a href="#dang-ky-tu-van" class="hero-slide" data-index="1">
        <img src="img/herobanner-2.png" alt="Banner tuyển sinh UEH 2" class="hero-image">
      </a>
      <a href="#dang-ky-tu-van" class="hero-slide" data-index="2">
        <img src="img/herobanner-3.png" alt="Banner tuyển sinh UEH 3" class="hero-image">
      </a>
    </div>
 
    <div class="hero-dots" role="tablist" aria-label="Chọn ảnh banner">
      <button type="button" class="hero-dot is-active" data-index="0" aria-label="Ảnh 1" aria-selected="true"></button>
      <button type="button" class="hero-dot" data-index="1" aria-label="Ảnh 2" aria-selected="false"></button>
      <button type="button" class="hero-dot" data-index="2" aria-label="Ảnh 3" aria-selected="false"></button>
    </div>
  </section>
 
  <script>
    // Bật/tắt menu mobile khi bấm nút hamburger
    (function () {
      var navbar = document.getElementById('navbar');
      var toggle = document.getElementById('navbarToggle');
 
      toggle.addEventListener('click', function () {
        var isOpen = navbar.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        toggle.setAttribute('aria-label', isOpen ? 'Đóng menu' : 'Mở menu');
      });
 
      // Đóng menu khi bấm 1 link/nút bên trong (trải nghiệm mobile tốt hơn)
      document.getElementById('navbarContent').addEventListener('click', function (e) {
        if (e.target.tagName === 'A' && navbar.classList.contains('is-open')) {
          navbar.classList.remove('is-open');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.setAttribute('aria-label', 'Mở menu');
        }
      });
    })();
 
    // Hero banner: chuyển ảnh khi bấm dot, tự động chuyển sau mỗi 5s
    (function () {
      var hero = document.getElementById('hero');
      if (!hero) return;
 
      var slides = hero.querySelectorAll('.hero-slide');
      var dots = hero.querySelectorAll('.hero-dot');
      var current = 0;
      var AUTOPLAY_MS = 5000;
      var timer = null;
 
      function goTo(index) {
        slides[current].classList.remove('is-active');
        dots[current].classList.remove('is-active');
        dots[current].setAttribute('aria-selected', 'false');
 
        current = index;
 
        slides[current].classList.add('is-active');
        dots[current].classList.add('is-active');
        dots[current].setAttribute('aria-selected', 'true');
      }
 
      function next() {
        goTo((current + 1) % slides.length);
      }
 
      function startAutoplay() {
        stopAutoplay();
        timer = setInterval(next, AUTOPLAY_MS);
      }
 
      function stopAutoplay() {
        if (timer) clearInterval(timer);
      }
 
      dots.forEach(function (dot, i) {
        dot.addEventListener('click', function () {
          goTo(i);
          startAutoplay(); // reset lại thời gian đếm khi người dùng tự bấm
        });
      });
 
      startAutoplay();
    })();
  </script>
 
</body>
</html>
